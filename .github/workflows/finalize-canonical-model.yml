name: Finalize Canonical Strategy Model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-canonical-model.yml"
      - ".canonical-finalizer-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove variant-era candidate structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = fn(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          def research(text):
              text = text.replace(
                  '@dataclass(frozen=True)\nclass Candidate:\n    """One canonical methodology. params is retained only for API compatibility and must stay empty."""\n    family: str\n    params: tuple = ()\n',
                  '@dataclass(frozen=True)\nclass Candidate:\n    """Exactly one canonical strategy methodology, identified only by immutable ID."""\n    strategy_id: str\n'
              )
              text = text.replace('yield Candidate(sid, ())', 'yield Candidate(sid)')
              text = re.sub(r'\n        if candidate\.params:\n            raise ValueError\("Canonical strategies do not accept parameter-grid variants"\)', '', text)
              text = text.replace('candidate.family', 'candidate.strategy_id')
              text = text.replace('result.candidate.family', 'result.candidate.strategy_id')
              text = text.replace(
                  'The old Cartesian parameter-grid universe was deleted. A strategy is now one\n    methodology with one immutable id. Parameter combinations are never emitted\n    as candidates and therefore can never inflate the strategy count.\n\n',
                  'A strategy is one methodology with one immutable ID. The research model has\n    no parameter-variant candidate type and can therefore represent each methodology once.\n\n'
              )
              text = text.replace('# There are no parameter variants to balance. Each methodology appears once.', '# Each methodology appears exactly once.')
              return text

          patch('xau_company/research.py', research)

          def adaptive(text):
              return text.replace('result.candidate.family', 'result.candidate.strategy_id')
          patch('xau_company/adaptive_research.py', adaptive)

          def selector(text):
              text = text.replace('self.score.candidate.family', 'self.score.candidate.strategy_id')
              text = text.replace('result.candidate.family', 'result.candidate.strategy_id')
              text = text.replace('def _family_regime_fit(self, family: str, regime: str) -> float:', 'def _strategy_regime_fit(self, strategy_id: str, regime: str) -> float:')
              text = text.replace('strategy = BY_ID.get(family)\n        category = strategy.category if strategy is not None else family', 'strategy = BY_ID.get(strategy_id)\n        category = strategy.category if strategy is not None else strategy_id')
              text = text.replace('family_fit = self._family_regime_fit(result.candidate.strategy_id, regime)', 'strategy_fit = self._strategy_regime_fit(result.candidate.strategy_id, regime)')
              text = text.replace('regime_fit = family_fit * 0.35 + regime_history * 0.65', 'regime_fit = strategy_fit * 0.35 + regime_history * 0.65')
              return text
          patch('xau_company/selector.py', selector)

          def orchestrator(text):
              text = text.replace('candidate.candidate.family', 'candidate.candidate.strategy_id')
              text = text.replace('"family": candidate.candidate.strategy_id,\n                "params": candidate.candidate.params,', '"strategy_id": candidate.candidate.strategy_id,')
              return text
          patch('xau_company/orchestrator.py', orchestrator)

          for p in Path('tests').glob('test_*.py'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('.candidate.family', '.candidate.strategy_id')
              text = text.replace('c.family for c in candidates', 'c.strategy_id for c in candidates')
              text = text.replace('c.family for c in selected', 'c.strategy_id for c in selected')
              text = text.replace('    assert all(c.params == () for c in selected)\n', '')
              p.write_text(text, encoding='utf-8')

          p = Path('tests/test_canonical_strategies.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import inspect\n', '')
          text = re.sub(
              r'def test_parameter_grid_architecture_is_gone\(monkeypatch\):.*?(?=\ndef test_live_research_is_fail_closed_until_survivors_exist)',
              '''def test_canonical_candidate_model_has_exactly_one_id_per_methodology(monkeypatch):\n    monkeypatch.setenv("XAU_RESEARCH_USE_ALL_437", "1")\n    lab = StrategyResearchAgent(max_candidates=437, catalog_size=109)\n    candidates = list(lab.candidates())\n    assert len(candidates) == 437\n    assert len({c.strategy_id for c in candidates}) == 437\n    assert not hasattr(candidates[0], "params")\n    assert lab.last_universe_size == 437\n    assert lab.catalog_size == 109\n\n''',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'def test_nonempty_params_are_rejected\(monkeypatch\):.*?raise AssertionError\("parameter variants must never be accepted"\)\n?',
              '''def test_candidate_constructor_has_no_parameter_slot():\n    try:\n        Candidate("S001", (1, 2, 3))\n    except TypeError:\n        pass\n    else:\n        raise AssertionError("canonical Candidate must accept only one strategy ID")\n''',
              text,
              flags=re.S,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify retired 27k architecture is absent
        run: |
          set -euo pipefail
          patterns='27,801|27_801|27801|tens of thousands|from itertools import product|strategy_library_path|enable_evolution|enable_invention|invention_library_path|discoveries_per_cycle|invented_variants_per_family|MAX_CANDIDATES|RESEARCH_CATALOG_SIZE'
          if grep -RInE "$patterns" --exclude-dir=.git --exclude='finalize-canonical-model.yml' .; then
            echo "Retired strategy-universe residue found"
            exit 1
          fi
      - name: Test canonical model
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt
          python -m compileall -q xau_company
          pytest -q
      - name: Commit final canonical model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xau_company tests
          git commit -m "Remove final 27k-era strategy model remnants"
          git push origin HEAD:main
