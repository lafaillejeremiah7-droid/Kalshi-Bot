name: One-shot provider cleanup

on:
  push:
    paths:
      - '.github/workflows/twelve-data-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove stale provider compatibility code
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected cleanup target not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          # Runtime: use the real keyless provider class directly.
          replace_exact(
              "main.py",
              "from xau_company.data import TwelveDataClient",
              "from xau_company.data import DukascopyClient",
          )
          replace_exact(
              "main.py",
              "    market = TwelveDataClient(cfg.twelve_data_api_key)\n",
              "    market = DukascopyClient()\n",
          )

          replace_exact(
              "xau_company/config.py",
              "    # Deprecated compatibility field. Live market data now comes from the\n"
              "    # keyless Dukascopy public datafeed; this value is not required or used.\n"
              "    twelve_data_api_key: str = os.getenv(\"TWELVE_DATA_API_KEY\", \"\")\n",
              "",
          )

          replace_exact(
              "xau_company/data.py",
              "\n    ``api_key`` remains an accepted constructor argument only for backwards\n"
              "    compatibility with older ``TwelveDataClient`` call sites. It is ignored.\n",
              "",
          )
          replace_exact(
              "xau_company/data.py",
              "        api_key: str = \"\",\n",
              "",
          )
          replace_exact(
              "xau_company/data.py",
              "        del api_key\n",
              "",
          )
          replace_exact(
              "xau_company/data.py",
              "\n\n# Backwards-compatible import name used by main.py and older tests. This is now\n"
              "# the keyless Dukascopy implementation; no Twelve Data request is made.\n"
              "TwelveDataClient = DukascopyClient\n",
              "\n",
          )

          # Tests: remove migration-only arguments/tests and exercise the real surface.
          replace_exact(
              "tests/test_dukascopy_data.py",
              "from xau_company.data import DukascopyClient, TwelveDataClient",
              "from xau_company.data import DukascopyClient",
          )
          replace_exact(
              "tests/test_dukascopy_data.py",
              "\n\ndef test_twelve_data_name_is_backward_compatible_alias() -> None:\n"
              "    assert TwelveDataClient is DukascopyClient\n\n\n"
              "def test_settings_no_longer_require_twelve_data_key() -> None:\n"
              "    Settings(twelve_data_api_key=\"\", paper_mode=True).validate()\n",
              "\n\ndef test_settings_validate_without_market_data_credentials() -> None:\n"
              "    Settings(paper_mode=True).validate()\n",
          )
          replace_exact(
              "tests/test_delivery_guards.py",
              "        twelve_data_api_key=\"test\",\n",
              "",
          )
          replace_exact(
              "tests/test_preflight.py",
              "    monkeypatch.delenv(\"TWELVE_DATA_API_KEY\", raising=False)\n",
              "",
          )
          replace_exact(
              "tests/test_synchronization.py",
              "        twelve_data_api_key=\"test\",\n",
              "",
          )

          # Provider-neutral quality logic should not name a retired vendor.
          replace_exact(
              "xau_company/quality.py",
              "        # Twelve Data timestamps identify the candle start. Never let a still-forming\n",
              "        # Provider timestamps identify the candle start. Never let a still-forming\n",
          )

          # Documentation: describe the actual keyless provider and current setup.
          replace_exact(
              "README.md",
              "The final Entry comes from Twelve Data's current-price endpoint rather than simply reusing the last candle close. The framework still labels the signal as research-only because a reference price is not a guaranteed executable broker fill.",
              "The final Entry comes from Dukascopy's most recent valid tick data rather than simply reusing the last candle close. The framework still labels the signal as research-only because a reference price is not a guaranteed executable broker fill.",
          )
          replace_exact(
              "README.md",
              "Fill in `TWELVE_DATA_API_KEY`, `TELEGRAM_BOT_TOKEN` and `TELEGRAM_CHAT_ID`. Keep `PAPER_MODE=true` until enough forward evidence exists.",
              "Fill in `TELEGRAM_BOT_TOKEN` and `TELEGRAM_CHAT_ID`. Dukascopy market data is keyless. Keep `PAPER_MODE=true` until enough forward evidence exists.",
          )

          touched = (
              "main.py",
              "README.md",
              "xau_company/config.py",
              "xau_company/data.py",
              "xau_company/quality.py",
              "tests/test_dukascopy_data.py",
              "tests/test_delivery_guards.py",
              "tests/test_preflight.py",
              "tests/test_synchronization.py",
          )
          for name in touched:
              p = Path(name)
              p.write_text(p.read_text().rstrip() + "\n")

          # Hard verification: no retired-provider names remain in tracked text files.
          forbidden = ("Twelve" + "Data", "Twelve Data", "TWELVE" + "_DATA", "twelve" + "_data")
          excluded = {Path(".github/workflows/twelve-data-cleanup.yml")}
          leftovers = []
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for name in tracked:
              p = Path(name)
              if p in excluded or not p.is_file():
                  continue
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              for needle in forbidden:
                  if needle in text:
                      leftovers.append(f"{name}: {needle}")
          if leftovers:
              raise SystemExit("Stale provider references remain:\n" + "\n".join(leftovers))
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python and tests
        run: |
          python -m compileall -q main.py xau_company tests
          python -m pytest -q

      - name: Commit cleanup to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py README.md xau_company/config.py xau_company/data.py xau_company/quality.py tests/test_dukascopy_data.py tests/test_delivery_guards.py tests/test_preflight.py tests/test_synchronization.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Remove Twelve Data compatibility remnants"
          git push origin HEAD:main
