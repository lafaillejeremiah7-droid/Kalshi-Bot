name: Fix Canonical KAMA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-canonical-kama.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix read-only KAMA buffer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xau_company/canonical_strategy_engine.py')
          text = p.read_text()
          old = 'vals=kama.to_numpy(dtype=float); scv=sc.fillna(0).to_numpy(dtype=float)'
          new = 'vals=kama.to_numpy(dtype=float).copy(); scv=sc.fillna(0).to_numpy(dtype=float)'
          if old not in text:
              raise SystemExit('KAMA patch target not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xau_company/canonical_strategy_engine.py
          git commit -m "Fix canonical KAMA signal buffer"
          git push origin HEAD:main
