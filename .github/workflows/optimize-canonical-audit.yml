name: Optimize Canonical Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-canonical-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse already-computed holdout trades
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/canonical_437_backtest.py')
          text = p.read_text(encoding='utf-8')
          old = '''            holdout=hold_m,\n            yearly=yearly,\n            selection_score=_selection_score(sel_m, yearly),\n            selection_p_value=_normal_positive_edge_pvalue(selection),\n        )'''
          new = '''            holdout=hold_m,\n            yearly=yearly,\n            selection_score=_selection_score(sel_m, yearly),\n            selection_p_value=_normal_positive_edge_pvalue(selection),\n            holdout_p_value=_normal_positive_edge_pvalue(holdout),\n        )'''
          if old not in text:
              raise SystemExit('evaluation metric target not found')
          text = text.replace(old, new, 1)
          old2 = '''        holdout_p_value = _normal_positive_edge_pvalue(_subset(\n            BACKTESTER.simulate(xau, engine.signal(next(s for s in STRATEGIES if s.strategy_id == r["strategy_id"])), atr_values, next(s for s in STRATEGIES if s.strategy_id == r["strategy_id"]).horizon),\n            xau.datetime,\n            HOLDOUT_START,\n            None,\n        ))\n        r["holdout_p_value"] = holdout_p_value\n        holdout_gate = bool('''
          new2 = '''        holdout_p_value = float(r.get("holdout_p_value", 1.0))\n        holdout_gate = bool('''
          if old2 not in text:
              raise SystemExit('duplicate holdout simulation target not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile optimized audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m py_compile scripts/canonical_437_backtest.py
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/canonical_437_backtest.py
          git commit -m "Reuse canonical holdout results without resimulation"
          git push origin HEAD:main
