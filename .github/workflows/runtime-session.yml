name: On-Demand XAUUSD Company

on:
  push:
    branches: [main]
    paths:
      - "runtime-control.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read requested state
        id: control
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          with open("runtime-control.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          enabled = payload.get("enabled") is True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
          print(f"Requested runtime state: {'ON' if enabled else 'OFF'}")
          PY

      - name: Install dependencies
        if: steps.control.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Restore persistent runtime state
        if: steps.control.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: data
          key: xau-runtime-state-${{ github.run_id }}
          restore-keys: |
            xau-runtime-state-

      - name: Verify Dukascopy live data and Telegram
        if: steps.control.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: XAU/USD
        run: python -m xau_company.preflight

      - name: Start dashboard server
        if: steps.control.outputs.enabled == 'true'
        shell: bash
        run: |
          nohup python dashboard_server.py --host 127.0.0.1 --port 8080 >/tmp/xau-dashboard.log 2>&1 &
          echo $! >/tmp/xau-dashboard.pid
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xau-dashboard.log
          exit 1

      - name: Start public dashboard tunnel
        if: steps.control.outputs.enabled == 'true'
        id: dashboard
        shell: bash
        run: |
          sudo curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          DASHBOARD_URL=""
          for _ in $(seq 1 30); do
            DASHBOARD_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$DASHBOARD_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$DASHBOARD_URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          curl -fsS "$DASHBOARD_URL/api/health" >/dev/null
          echo "url=$DASHBOARD_URL" >> "$GITHUB_OUTPUT"
          echo "### Live XAU/USD dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "$DASHBOARD_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard URL: $DASHBOARD_URL"

          python - "$DASHBOARD_URL" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          payload = {
              "active": True,
              "url": sys.argv[1],
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "started_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("dashboard-live.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-live.json
          git commit -m "Publish live dashboard URL [skip ci]"
          git push origin HEAD:main

      - name: Run company until OFF
        if: steps.control.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_MODE: "false"
          RUNTIME_CONTROL_URL: https://raw.githubusercontent.com/lafaillejeremiah7-droid/XAUUSD-Company/main/runtime-control.json
          RUNTIME_CONTROL_POLL_SECONDS: "15"
          RUNTIME_CONTROL_MAX_FAILURES: "2"
        run: python -m xau_company.runtime_control

      - name: Archive session state
        if: always() && steps.control.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xau-runtime-state-${{ github.run_id }}
          path: data
          if-no-files-found: ignore
          retention-days: 30
