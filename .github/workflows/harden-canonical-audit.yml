name: Harden Canonical Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-canonical-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce multiple-testing and holdout significance gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/canonical_437_backtest.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'MIN_SELECTION_TRADES = 30\nMIN_HOLDOUT_TRADES = 15\n',
              'MIN_SELECTION_TRADES = 30\nMIN_HOLDOUT_TRADES = 15\nMAX_SELECTION_BH_Q = 0.10\nMAX_HOLDOUT_P_VALUE = 0.10\n'
          )
          old_gate = '''        r["selection_gate"] = bool(\n            int(sel["trades"]) >= MIN_SELECTION_TRADES\n            and float(sel["avg_r"]) > 0.0\n            and float(sel["profit_factor"]) > 1.0\n        )'''
          new_gate = '''        r["selection_gate"] = bool(\n            int(sel["trades"]) >= MIN_SELECTION_TRADES\n            and float(sel["avg_r"]) > 0.0\n            and float(sel["profit_factor"]) > 1.0\n            and float(r.get("selection_bh_q", 1.0)) <= MAX_SELECTION_BH_Q\n        )'''
          if old_gate not in text:
              raise SystemExit('selection gate target not found')
          text = text.replace(old_gate, new_gate, 1)
          old_hold = '''        holdout_gate = bool(\n            int(hold["trades"]) >= MIN_HOLDOUT_TRADES\n            and float(hold["avg_r"]) > 0.0\n            and float(hold["profit_factor"]) > 1.0\n            and float(hold["max_drawdown_r"]) <= 25.0\n        )'''
          new_hold = '''        holdout_p_value = _normal_positive_edge_pvalue(_subset(\n            BACKTESTER.simulate(xau, engine.signal(next(s for s in STRATEGIES if s.strategy_id == r["strategy_id"])), atr_values, next(s for s in STRATEGIES if s.strategy_id == r["strategy_id"]).horizon),\n            xau.datetime,\n            HOLDOUT_START,\n            None,\n        ))\n        r["holdout_p_value"] = holdout_p_value\n        holdout_gate = bool(\n            int(hold["trades"]) >= MIN_HOLDOUT_TRADES\n            and float(hold["avg_r"]) > 0.0\n            and float(hold["profit_factor"]) > 1.0\n            and float(hold["max_drawdown_r"]) <= 25.0\n            and holdout_p_value <= MAX_HOLDOUT_P_VALUE\n        )'''
          if old_hold not in text:
              raise SystemExit('holdout gate target not found')
          text = text.replace(old_hold, new_hold, 1)
          text = text.replace(
              '"multiple_testing": "one-sided positive-edge p-values with Benjamini-Hochberg q-values reported",',
              '"multiple_testing": "one-sided positive-edge p-values with Benjamini-Hochberg q<=0.10 required before ranking",\n            "holdout_confirmation": "frozen selection winners must independently pass positive-edge p<=0.10 on untouched holdout; holdout cannot promote replacements",'
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile hardened audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m py_compile scripts/canonical_437_backtest.py
      - name: Commit hardened audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/canonical_437_backtest.py
          git commit -m "Enforce canonical audit significance gates"
          git push origin HEAD:main
