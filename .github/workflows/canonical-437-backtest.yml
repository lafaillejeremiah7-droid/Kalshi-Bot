name: Canonical 437 Historical Backtest

on:
  push:
    branches: [main]
    paths:
      - "xau_company/canonical_strategies.py"
      - "xau_company/canonical_strategy_engine.py"
      - "xau_company/research.py"
      - "scripts/canonical_437_backtest.py"
      - "tests/test_canonical_strategies.py"
      - ".github/workflows/canonical-437-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-437-xauusd-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: ${{ github.workspace }}
      CANONICAL_437_REPORT: canonical-437-backtest-report.json
      CANONICAL_437_SURVIVORS: xau_company/surviving_strategies.json
      BACKTEST_CACHE: /tmp/xau-canonical-437
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pandas>=2.2,<3"

      - name: Compile canonical research path
        run: |
          python -m py_compile scripts/canonical_437_backtest.py
          python -m compileall -q xau_company

      - name: Verify canonical library invariants
        run: pytest -q tests/test_canonical_strategies.py

      - name: Run 437-strategy historical audit
        run: |
          set -o pipefail
          python scripts/canonical_437_backtest.py 2>&1 | tee canonical-437-backtest.log

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-437-backtest-${{ github.run_id }}
          path: |
            canonical-437-backtest-report.json
            canonical-437-backtest.log
            xau_company/surviving_strategies.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish survivor set and report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-437-backtest-report.json xau_company/surviving_strategies.json
          if git diff --cached --quiet; then
            echo "Canonical audit outputs unchanged"
            exit 0
          fi
          git commit -m "Publish canonical 437 XAUUSD survivor audit [skip ci]"
          git push origin HEAD:main
