name: Telegram Test Signal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-signal.yml"

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send clearly labeled test signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from xau_company.models import Direction, TradeSignal
          from xau_company.telegram import TelegramNotifier

          signal = TradeSignal(
              symbol="XAU/USD",
              direction=Direction.BUY,
              entry=100.00,
              stop_loss=99.00,
              take_profit=102.00,
              confidence=0.0,
              regime="TEST MODE — NOT MARKET DATA",
              reasons=[
                  "TEST SIGNAL ONLY — DO NOT TRADE THESE VALUES.",
                  "Generated manually to verify the company's real Telegram delivery path.",
                  "This was not selected by the strategy lab and is not a live trading recommendation.",
              ],
              votes=[],
              selected_strategy="TEST ONLY — TELEGRAM PIPELINE CHECK",
              strategy_stats={},
          )

          notifier = TelegramNotifier(
              os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              os.environ.get("TELEGRAM_CHAT_ID", ""),
          )
          message_id = notifier.send(signal)
          print(f"TEST_SIGNAL_DELIVERED message_id={message_id}")
          PY
