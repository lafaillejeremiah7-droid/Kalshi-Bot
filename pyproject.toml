[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-btc15m-research"
version = "0.1.0"
description = "Research-only data, math, replay, and validation system for Kalshi BTC 15-minute markets"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic>=2.8,<3",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
kalshi-research = "kalshi_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin CI to correctness rules so Ruff version upgrades cannot silently add broad style gates.
select = ["E4", "E7", "E9", "F"]
